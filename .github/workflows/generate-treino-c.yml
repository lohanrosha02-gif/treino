name: Gerar vídeos Treino C
on:
  push:
    branches: [main]
    paths:
      - scripts/generate_treino_c.py
      - .github/workflows/generate-treino-c.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências de renderização
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb libgl1 libxrender1 libsm6
          python -m pip install --upgrade pip
          python -m pip install numpy pillow vtk
      - name: Gerar vídeos 3D em MP4
        run: xvfb-run -a python scripts/generate_treino_c.py
      - name: Salvar vídeos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/C_*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets: vídeos 3D das mobilidades e prancha do Treino C"
            git push
          fi
